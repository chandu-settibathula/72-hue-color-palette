<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

<title>Spectrum Studio | Mobile-Optimized Palette</title>
<style>
  :root {
    --bg-color: #121212;
    --dot-color: rgba(255, 255, 255, 0.08);
    --panel-bg: rgba(20, 20, 22, 0.88);
    --border-color: rgba(255, 255, 255, 0.12);
    --text-primary: #f0f0f0;
    --text-secondary: #999999;
    --card-radius: 8px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100vw;
    height: 100dvh;
    margin: 0;
    padding: 0;
    background-color: var(--bg-color);
    background-image: radial-gradient(var(--dot-color) 1.5px, transparent 1.5px);
    background-size: 24px 24px;
    color: var(--text-primary);
    font-family: 'Elms Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  /* Main Wrapper with Padding around the layout */
  .app-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    padding: 16px;
    gap: 12px;
  }

  /* Header Card */
  .header {
    padding: 14px 16px 12px;
    text-align: center;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-color);
    border-radius: var(--card-radius);
    z-index: 30;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }

  .header h1 {
    font-weight: 600;
    letter-spacing: -0.3px;
    margin: 0;
    font-size: clamp(1.05rem, 4.2vw, 1.35rem);
    color: #ffffff;
  }

  .header p {
    color: var(--text-secondary);
    margin: 0;
    font-size: 0.8rem;
    font-weight: 400;
  }

  /* Controls & Buttons */
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 540px;
  }

  .btn {
    background: rgba(255, 255, 255, 0.05);
    color: #cccccc;
    border: 1px solid var(--border-color);
    padding: 8px 12px;
    border-radius: var(--card-radius);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    flex: 1;
    min-width: 85px;
    text-align: center;
  }

  .btn:hover {
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
  }

  .btn.active {
    background: #ffffff;
    color: #121212;
    border-color: #ffffff;
    font-weight: 600;
  }

  /* Hue Scrubber Bar */
  .scrubber-container {
    width: 100%;
    max-width: 540px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 2px 4px;
  }

  .scrubber-label {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    font-weight: 500;
    min-width: 100px;
    text-align: left;
  }

  .hue-scrubber {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(to right, 
      #888 0%, #888 1.3%,
      hsl(0, 85%, 50%) 1.3%, 
      hsl(60, 85%, 50%) 16.6%, 
      hsl(120, 85%, 50%) 33.3%, 
      hsl(180, 85%, 50%) 50%, 
      hsl(240, 85%, 50%) 66.6%, 
      hsl(300, 85%, 50%) 83.3%, 
      hsl(360, 85%, 50%) 100%);
    outline: none;
    cursor: pointer;
  }

  .hue-scrubber::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #121212;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    cursor: pointer;
  }

  /* Framed Palette Card */
  .palette-wrapper {
    flex: 1;
    width: 100%;
    height: 100%;
    min-height: 0;
    display: flex;
    position: relative;
    overflow-x: scroll;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
    scroll-behavior: smooth;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-color);
    border-radius: var(--card-radius);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }

  .palette-wrapper::-webkit-scrollbar, .history-bar::-webkit-scrollbar {
    height: 6px;
  }
  .palette-wrapper::-webkit-scrollbar-track, .history-bar::-webkit-scrollbar-track {
    background: transparent;
  }
  .palette-wrapper::-webkit-scrollbar-thumb, .history-bar::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.25);
    border-radius: 8px;
  }

  .palette-container {
    display: flex;
    gap: 3px;
    height: 100%;
    padding: 12px;
  }

  .palette-wrapper.mode-fit .palette-container {
    width: 100%;
    gap: 1.5px;
    padding: 12px 8px;
  }
  .palette-wrapper.mode-fit .hue-column {
    min-width: 0;
    flex: 1;
  }

  .palette-wrapper.mode-scroll .palette-container {
    width: max-content;
  }
  
  .palette-wrapper.mode-scroll .hue-column {
    width: 38px;
    flex-shrink: 0;
  }

  .hue-column {
    display: flex;
    flex-direction: column;
    gap: 2px;
    height: 100%;
  }

  .hue-label {
    font-size: 10px;
    color: #888888;
    text-align: center;
    margin-bottom: 2px;
    font-weight: 600;
    line-height: 1;
    overflow: hidden;
    white-space: nowrap;
  }

  .swatch {
    flex: 1;
    width: 100%;
    border-radius: 3px;
    cursor: pointer;
    transition: transform 0.15s ease;
    position: relative;
    min-height: 0;
    touch-action: pan-x;
  }

  .swatch:active, .swatch:hover {
    transform: scale(2.1);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.85);
    z-index: 20;
    border-radius: 4px;
  }

  /* Footer Card */
  .footer {
    padding: 12px 16px;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-color);
    border-radius: var(--card-radius);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 30;
    flex-shrink: 0;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }

  .history-container {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
  }

  .history-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
  }

  .history-bar {
    flex: 1;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 0;
    align-items: center;
    min-height: 32px;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
  }

  .history-empty {
    font-size: 12px;
    color: var(--text-secondary);
    font-style: italic;
  }

  .history-swatch {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s ease;
  }

  .history-swatch:hover {
    transform: scale(1.2);
  }

  .btn-clear {
    flex: 0 0 auto;
    min-width: unset;
    padding: 6px 12px;
    font-size: 11px;
    border-radius: 6px;
  }

  .copyright {
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    color: #aaaaaa;
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 85px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #222225;
    color: #ffffff;
    padding: 10px 20px;
    border-radius: var(--card-radius);
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
    border: 1px solid var(--border-color);
    z-index: 100;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  @media (max-width: 768px) {
    .app-container {
      padding: 10px;
      gap: 10px;
    }
    .header {
      padding: 10px 12px;
    }
    .palette-container {
      padding: 8px;
    }
    .copyright {
      font-size: 11px;
    }
    .history-title {
      font-size: 12px;
    }
  }
</style>
</head>
<body>

<div class="app-container">

  <div class="header">
    <h1>Spectrum Studio | Chandu Settibathula</h1>
    <p>1,460 Color Variations • 20 Shades per Hue</p>
    
    <div class="controls">
      <button class="btn active" id="btnScroll">Touch View</button>
      <button class="btn" id="btnFit">Fit Screen</button>
      <button class="btn" id="btnFormat">Format: HSL</button>
    </div>

    <div class="scrubber-container">
      <span class="scrubber-label" id="scrubberText">Jump Hue: Gray</span>
      <input type="range" min="0" max="72" value="0" class="hue-scrubber" id="hueScrubber">
    </div>
  </div>

  <div class="palette-wrapper mode-scroll" id="wrapper">
    <div class="palette-container" id="palette"></div>
  </div>

  <div class="footer">
    <div class="history-container">
      <span class="history-title">History:</span>
      <div class="history-bar" id="historyBar">
        <span class="history-empty">Tap any color swatch to copy</span>
      </div>
      <button class="btn btn-clear" id="btnClearHistory">Clear History</button>
    </div>
    <div class="copyright">
      &copy; 2026 Chandu Settibathula. All rights reserved.
    </div>
  </div>

</div>

<div class="toast" id="toast">Color copied!</div>

<script>
  const container = document.getElementById('palette');
  const wrapper = document.getElementById('wrapper');
  const toast = document.getElementById('toast');
  const historyBar = document.getElementById('historyBar');
  const btnClearHistory = document.getElementById('btnClearHistory');
  
  const btnFit = document.getElementById('btnFit');
  const btnScroll = document.getElementById('btnScroll');
  const btnFormat = document.getElementById('btnFormat');
  const hueScrubber = document.getElementById('hueScrubber');
  const scrubberText = document.getElementById('scrubberText');

  let currentFormat = 'hsl';
  let toastTimeout;
  const columnsRef = [];
  const colorHistory = [];

  function hslToRgb(h, s, l) {
    s /= 100;
    l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return [Math.round(255 * f(0)), Math.round(255 * f(8)), Math.round(255 * f(4))];
  }

  function rgbToHex(r, g, b) {
    return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
  }

  function formatColor(h, s, l) {
    if (currentFormat === 'hex') {
      const [r, g, b] = hslToRgb(h, s, l);
      return rgbToHex(r, g, b);
    } else if (currentFormat === 'rgb') {
      const [r, g, b] = hslToRgb(h, s, l);
      return `rgb(${r}, ${g}, ${b})`;
    }
    return `hsl(${h}, ${s}%, ${l}%)`;
  }

  function createColumn(labelText, isGray, hueVal) {
    const column = document.createElement('div');
    column.className = 'hue-column';
    
    const label = document.createElement('div');
    label.className = 'hue-label';
    label.textContent = labelText;
    column.appendChild(label);

    for (let s = 0; s < 20; s++) {
      const l = parseFloat((95 - (s * 4.5)).toFixed(1)); 
      const sat = isGray ? 0 : 85;
      const h = isGray ? 0 : hueVal;

      const swatch = document.createElement('div');
      swatch.className = 'swatch';
      
      swatch.dataset.h = h;
      swatch.dataset.s = sat;
      swatch.dataset.l = l;

      const colorStr = formatColor(h, sat, l);
      swatch.style.backgroundColor = `hsl(${h}, ${sat}%, ${l}%)`;
      swatch.title = colorStr;

      swatch.addEventListener('click', () => copyColor(swatch));

      column.appendChild(swatch);
    }
    return column;
  }

  function buildPalette() {
    container.innerHTML = '';
    columnsRef.length = 0;

    const grayCol = createColumn('Gray', true, 0);
    container.appendChild(grayCol);
    columnsRef.push(grayCol);

    for (let h = 0; h < 360; h += 5) {
      const hueCol = createColumn(`${h}°`, false, h);
      container.appendChild(hueCol);
      columnsRef.push(hueCol);
    }
  }

  function updateColorValues() {
    document.querySelectorAll('.swatch').forEach(swatch => {
      const h = parseFloat(swatch.dataset.h);
      const s = parseFloat(swatch.dataset.s);
      const l = parseFloat(swatch.dataset.l);
      swatch.title = formatColor(h, s, l);
    });
  }

  function addToHistory(val, h, s, l) {
    const existingIndex = colorHistory.findIndex(item => item.value === val);
    if (existingIndex > -1) {
      colorHistory.splice(existingIndex, 1);
    }
    colorHistory.unshift({ value: val, h, s, l });
    if (colorHistory.length > 20) colorHistory.pop();
    renderHistory();
  }

  function renderHistory() {
    historyBar.innerHTML = '';
    if (colorHistory.length === 0) {
      historyBar.innerHTML = '<span class="history-empty">Tap any color swatch to copy</span>';
      return;
    }
    colorHistory.forEach(item => {
      const swatch = document.createElement('div');
      swatch.className = 'history-swatch';
      swatch.style.backgroundColor = `hsl(${item.h}, ${item.s}%, ${item.l}%)`;
      swatch.title = item.value;
      swatch.addEventListener('click', () => {
        navigator.clipboard.writeText(item.value);
        showToast(`Copied ${item.value}`);
      });
      historyBar.appendChild(swatch);
    });
  }

  btnClearHistory.addEventListener('click', () => {
    colorHistory.length = 0;
    renderHistory();
    showToast('History cleared');
  });

  function copyColor(swatch) {
    const h = parseFloat(swatch.dataset.h);
    const s = parseFloat(swatch.dataset.s);
    const l = parseFloat(swatch.dataset.l);
    const val = formatColor(h, s, l);
    
    navigator.clipboard.writeText(val);
    addToHistory(val, h, s, l);
    showToast(`Copied ${val}`);
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
      toast.classList.remove('show');
    }, 2000);
  }

  btnScroll.addEventListener('click', () => {
    wrapper.classList.remove('mode-fit');
    wrapper.classList.add('mode-scroll');
    btnScroll.classList.add('active');
    btnFit.classList.remove('active');
  });

  btnFit.addEventListener('click', () => {
    wrapper.classList.remove('mode-scroll');
    wrapper.classList.add('mode-fit');
    btnFit.classList.add('active');
    btnScroll.classList.remove('active');
  });

  btnFormat.addEventListener('click', () => {
    if (currentFormat === 'hsl') currentFormat = 'hex';
    else if (currentFormat === 'hex') currentFormat = 'rgb';
    else currentFormat = 'hsl';
    
    btnFormat.textContent = `Format: ${currentFormat.toUpperCase()}`;
    updateColorValues();
  });

  hueScrubber.addEventListener('input', (e) => {
    const index = parseInt(e.target.value, 10);
    if (index === 0) {
      scrubberText.textContent = `Jump Hue: Gray`;
    } else {
      const hueAngle = (index - 1) * 5;
      scrubberText.textContent = `Jump Hue: ${hueAngle}°`;
    }

    if (columnsRef[index]) {
      if (wrapper.classList.contains('mode-fit') && window.innerWidth < 768) {
        btnScroll.click();
      }
      columnsRef[index].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  });

  if (window.innerWidth <= 768) {
    wrapper.classList.remove('mode-fit');
    wrapper.classList.add('mode-scroll');
    btnScroll.classList.add('active');
    btnFit.classList.remove('active');
  }

  buildPalette();
  renderHistory();
</script>
</body>
</html>
